<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Network Capture Extension</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--bb-text); background: var(--bb-navy); }
    .top { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--bb-navy-2); border-bottom: 1px solid var(--bb-line); }
    .brand { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; margin-right: 6px; }
    .brand img { display: block; background: #fff; border-radius: 6px; padding: 3px; }
    .brand .title { font-weight: 700; letter-spacing: .2px; }
    .brand .sub { font-size: 10.5px; color: var(--bb-muted); text-transform: uppercase; letter-spacing: 1px; }
    .top .stats { display: flex; gap: 16px; flex: 1; color: var(--bb-muted); font-size: 12px; }
    .stat b { color: #fff; }
    .btn { background: var(--bb-navy-3); border: 1px solid var(--bb-line); color: var(--bb-text); border-radius: 5px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
    .btn:hover { background: #1a3257; border-color: var(--bb-blue); }
    .btn.primary { background: var(--bb-blue); border-color: var(--bb-blue); }
    .btn.primary:hover { background: var(--bb-blue-hover); }
    .btn.rec { background: var(--bb-rec); border-color: var(--bb-rec-line); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .label { color: var(--bb-muted); }
    .link { flex: 1; color: var(--bb-blue-hi); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .filter { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--bb-line); background: var(--bb-navy-2); }
    .filter input, .filter select { background: var(--bb-navy); color: var(--bb-text); border: 1px solid var(--bb-line); border-radius: 5px; padding: 6px 8px; font-size: 12px; }
    .filter input { flex: 1; }
    .filter input:focus, .filter select:focus { outline: none; border-color: var(--bb-blue-hi); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 110px); overflow: hidden; }
    .list { overflow: auto; border-right: 1px solid var(--bb-line); }
    table { width: 100%; border-collapse: collapse; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
    th { position: sticky; top: 0; background: var(--bb-navy-2); text-align: left; padding: 6px 8px; font-size: 11px; color: var(--bb-muted); border-bottom: 1px solid var(--bb-line); }
    td { padding: 5px 8px; border-bottom: 1px solid var(--bb-navy-2); cursor: pointer; }
    tr:hover td { background: var(--bb-navy-2); }
    tr.sel td { background: #1e468c; }
    .ok { color: #3ddc84; } .err { color: #ff7a6c; } .warn { color: #f1c40f; }
    .detail { overflow: auto; padding: 12px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 8px; border-bottom: 1px solid var(--bb-line); }
    .tab { padding: 6px 10px; cursor: pointer; color: var(--bb-muted); font-size: 12px; border-bottom: 2px solid transparent; }
    .tab.active { color: #fff; border-color: var(--bb-blue-hi); }
    pre { white-space: pre-wrap; word-break: break-all; background: var(--bb-navy); padding: 10px; border-radius: 5px; font-size: 11.5px; color: #d0d6e0; }
    .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
    .kv .k { color: var(--bb-muted); }
    .muted { color: var(--bb-muted); }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <img src="assets/logo-b.svg" width="22" height="29" alt="BuenaIA" />
      <div>
        <div class="title">Network Capture Extension</div>
        <div class="sub">BuenaIA</div>
      </div>
    </div>
    <div class="stats">
      <span class="stat">Status: <b id="status">Idle</b></span>
      <span class="stat">Requests: <b id="count">0</b></span>
      <span class="stat">Bytes: <b id="bytes">0</b></span>
      <span class="stat">Elapsed: <b id="timer">00:00</b></span>
      <span class="stat">Tab: <b id="tab">-</b></span>
    </div>
    <button id="startBtn" class="btn rec">Start</button>
    <button id="pauseBtn" class="btn" disabled>Pause</button>
    <button id="stopBtn"  class="btn" disabled>Stop</button>
    <button id="clearBtn" class="btn">Clear</button>
    <button id="dlZip"    class="btn primary">⬇ ZIP</button>
    <button id="dlJson"   class="btn">JSON</button>
    <button id="dlHar"    class="btn">HAR</button>
    <button id="dlCsv"    class="btn">CSV</button>
  </div>
  <div class="top">
    <span class="label">Target:</span>
    <a id="targetUrl" class="link" href="#" title="Open / focus this tab">-</a>
    <button id="openSite"     class="btn">Open / focus</button>
    <button id="reloadSite"   class="btn">Reload</button>
    <button id="hardReload"   class="btn">Hard reload</button>
    <button id="clearCookies" class="btn">Clear cookies</button>
    <button id="clearCache"   class="btn">Clear cache</button>
  </div>
  <div class="filter">
    <input id="filter" placeholder="Filter URL / method / status / mime…">
    <select id="typeFilter"><option value="">All types</option>
      <option>XHR</option><option>Fetch</option><option>Document</option><option>Script</option>
      <option>Stylesheet</option><option>Image</option><option>Media</option><option>Font</option>
      <option>WebSocket</option><option>Other</option></select>
    <select id="methodFilter"><option value="">All methods</option>
      <option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option>
      <option>PATCH</option><option>OPTIONS</option><option>HEAD</option></select>
  </div>
  <div class="grid">
    <div class="list">
      <table>
        <thead><tr>
          <th>#</th><th>Method</th><th>Status</th><th>Type</th><th>Host</th><th>Path</th><th>Time</th><th>Bytes</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="detail" id="detail">
      <em class="muted">Pick a request from the list to see its full details — headers, cookies, params, post body, response headers, response cookies, response body.</em>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
